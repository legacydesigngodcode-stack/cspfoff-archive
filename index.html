t here’s what I know now:\nSexual energy is not the enemy.\nIt’s life force.\nIt’s raw, unfiltered creative fire.\n\nAnd when you finally stop trying to spend it...\nWhen you stop giving it to fantasy, to validation, to momentary escape...\nIt becomes fuel.\n\nFuel for your healing.\nFuel for your clarity.\nFuel for your becoming.\n\nI’m not here because I mastered it.\nI’m here because I stopped lying to myself about it.\n\nThis energy still lives in me. Still pulses. Still tempts.\nBut now I see it for what it really is:\n\nA sacred power that only destroys when it's wasted.\nA divine gift that only consumes when it’s ignored.\n\nI’m learning to channel it now.\nTo let it rise without hijacking me.\nTo feel it without feeding it.\n\nAnd every day I do...\nI remember that what once kept me stuck…\nis now helping me build.", "images": ["assets/post-145-1.webp"], "archive_number": "1", "primary_archive": "I · First Signals", "featured": false, "published_in_archive": true}, {"id": "entry-146", "date": "2025-07-25", "timestamp": 1753455563, "title": "A Moment", "display_text": "A moment I didn’t expect, and a truth I didn’t know I needed.\n\nI used to walk through life with a pocket full of justifications.\nWhy I reacted that way.\nWhy I pushed people away.\nWhy I wasn’t ready.\nAnd I convinced myself I was just surviving.\n\nBut now...every choice, every outcome, every mistake is a lesson.\nAnd when everything is a lesson...\nthe mirror stops lying to you.\n\nIt stops giving you room to blame.\nIt stops making your chaos poetic.\nIt stops giving your shadow a microphone.\n\nWhat happened tonight wasn’t wild. It wasn’t a breakdown or a breakthrough.\nJust a real moment. A familiar face I hadn’t seen in years.\nOne of those faces that used to know you when you weren’t really you.\n\nShe looked tired. Worn.\nYou could feel the years on her before she ever spoke.\nAnd when she saw me...\nit wasn’t a conversation.\nIt was something older.\nA silent moment between two people who didn’t expect to meet like that…\nbut somehow needed to.\n\nThere was no performance. No posture.\nJust a hug that said more than words could.\nAnd a moment I didn’t see coming...\nbut felt down to my core.\n\nIt hit me, quietly but deeply:\nI’ve changed.\n\nNot because I resisted old thoughts.\nNot because I avoided something tempting.\nBut because I didn’t need to flinch.\nI didn’t need to prove anything.\nI could just stand still and let the mirror reflect what was actually true.\n\nIt wasn’t pride.\nIt was peace.\n\nNot needing to be more.\nNot hiding who I’ve been.\nJust owning it...and knowing that’s enough.\n\nI used to think healing was loud.\nBut maybe it’s just quiet clarity.\nThe kind you earn by not reacting.\nThe kind that doesn’t beg for recognition...\nbecause it already knows.\n\nBecause when every step becomes a lesson...\n\nAttachments become easy to lose,\nwhen your mirror makes no excuse.", "images": ["assets/post-146-1.webp"], "archive_number": "5", "primary_archive": "V · The Walk", "featured": false, "published_in_archive": true}, {"id": "entry-147", "date": "2025-07-24", "timestamp": 1753369532, "title": "Falling Into Place", "display_text": "Its not falling apart. \nIt’s falling into place. \n\nThere comes a moment...quiet but heavy...when you stop trying to force it all to make sense.\n\nWhen you stop fighting the storm… and start listening to it.\n\nNot every setback is punishment.\nSome are protection.\nSome are redirection.\nSome are just the universe saying: “Not this way, not yet.”\n\nYou don’t need to know all the answers to take the next step.\nYou just need to trust that you're being led...even when it feels like loss.\n\nAnd if you’ve been asking for a sign, maybe this is it.\nNot the end...just the invitation to surrender.\n\nLet go.\nBreathe deeper.\nYou’re not lost. You’re just in the part of the story where everything changes.\n\n#FallingIntoPlace\n#SurrenderTheOutcome\n#TrustTheTiming\n#SpiritualAwakening\n#LetGoAndGrow\n#YouAreBeingLed", "images": ["assets/post-147-1.webp"], "archive_number": "5", "primary_archive": "V · The Walk", "featured": false, "published_in_archive": true}, {"id": "entry-148", "date": "2025-07-23", "timestamp": 1753280553, "title": "The Ache Was Always the Signal", "display_text": "Part of the Lonely Bones Archive.\nMade for the ones still bleeding,\nbut walking toward the light anyway.\n“The Ache Was Always the Signal ...”\n“The Universe Was Always Inside.”\n\nDark Tree Wall Art – Framed Canvas Symbol of Survival & Spiritual Healing\nThe Tree That Stayed\n\n---\n\nThis image has been with me over 20 years.\n\nI didn’t design it...I received it.\nNot all at once. Not in clarity.\nBut in fragments, like a language only pain understands.\n\nA tree. Black. Fruitless.\nNot dead, but withdrawn.\nAnd from its branch...\nmy heart.\nBound by rope, cracked and stitched, hanging instead of living inside me.\n\nThis wasn’t poetic.\nThis was brutal.\nThis was the truth of how I learned to survive...\nby sacrificing the part of me that loved first.\nI gave it up to keep going.\nHung it high so I wouldn't have to feel it anymore.\n\nBut the tree didn’t bloom after that.\nIt just stood there...strong but hollow.\nAnd I mistook survival for success.\n\nThen, one night, the storm came.\nNot metaphorical...real thunder. Real rain.\nI was deep in a download. Yearning. Longing. Trusting just enough.\n\nLightning flashed...white and stern like the hand of something divine.\nNot cruel. Just… corrective.\n“You haven’t received it yet,” it whispered.\n\nAnd that’s when I saw it.\nThe black tree… glowing from within.\nFive or six dots of light...soft, still, patient.\nI tried to make sense of them. Tried to find the pattern.\nBut clarity doesn’t come on demand.\nIt comes when you walk closer.\n\nSo I did.\n\nFace to the rain.\nBare soul to the storm.\nAnd I saw it:\nMy heart in the noose, draining everything I was meant to root into the earth.\nThe light wasn’t asking for understanding.\nIt was offering return.\n\nNot to who I was.\nBut to who I really am, beneath who I had to be to survive.\n#TheAcheWasTheSignal\n#SurvivalIsNotSuccess\n#LonelyBonesArchive\n#StillBleedingStillWalking\n#SoulArt\n#SpiritualScars\n#SymbolOfHealing\n#RootedInPain\n#LetTheStormSpeak\n#ReturningToMyself", "images": ["assets/post-148-1.webp"], "archive_number": "3", "primary_archive": "III · Relationships", "featured": false, "published_in_archive": true}, {"id": "entry-149", "date": "2025-07-22", "timestamp": 1753207476, "title": "A Soul's Purpose: Part IV", "display_text": "A Soul’s Purpose – Part 4\nThe Mirror of the Moment \n\nThis isn’t a new chapter.\nIt’s a continuation of Part 3.\nWhere that one cracked me open...this one asked me to trust what poured out.\nIt’s not about ego vs. soul.\nIt’s about what I choose after the mirror shows me myself.\nThis is surrender. This is grace.\nThis is gratitude, in motion.\n\nThe question was presented.\nAnd I know I’m obligated to walk in it.\n\nLast night, I acted in flesh.\nI felt wronged. Belittled. Unseen.\nAnd I reacted...not from soul...but from ego.\n\nAnger. Shame. Rebellion.\nIt came fast and loud.\nBecause my ego is one of my greatest resistances.\nIt has led me through so much pain and survival,\nbut now… it can’t lead anymore.\n\nI see now...\nIt wasn’t just about being wronged.\nIt was about not being heard.\nNot feeling like I mattered.\n\nBut the mirror showed me the truth.\nAnd it showed me myself.\n\nThis path is about remembering...\nand every mistake is a message,\nevery reaction is a reflection.\n\nI hope I meet the next one with more grace.\nMore love.\nMore stillness.\n\nEven if I am wronged...\nI don’t need to carry their brokenness as my identity.\n\nThey’re human, too.\nAnd so am I.\n\nDirection is mercy.\nAnd this… was mercy.\n\n#graceinmotion\n#soulaccountability\n#mirrorsaremessages\n#theegorecedes\n#thankyouforthelesson\n#directionismercy", "images": ["assets/post-149-1.webp"], "archive_number": "2", "primary_archive": "II · The Mirror", "featured": false, "published_in_archive": true}, {"id": "entry-150", "date": "2025-07-22", "timestamp": 1753206435, "title": "A Soul's Purpose: Part III", "display_text": "A Soul’s Purpose – Part 3\nThe Mirror and the Mercy \n\nBefore you read this...\nIt’s okay if this feels like too much.\nIt’s okay if it sounds impossible, or strange, or just… not yet.\nThere was a time I would’ve laughed this off too.\nBut the deeper I listened, the more I remembered.\nSo take what resonates.\nLeave what doesn’t.\nAnd just know...\nyou don’t have to believe it yet…\nfor it to already be true.\n\nEntangled souls.\nTwin flames.\nCore soul families.\n\nThese are not poetic ideas.\nThey’re real.\nYou can feel them when you meet someone who shakes something loose inside you...\nnot because of who they are,\nbut because of who they were to you before.\n\nMy wife could have been my sister.\nMy daughter could have been my mother.\nMy enemies could’ve been my lovers.\nAnd all of it was chosen.\n\nThe soul chooses its vessel.\nIts challenges.\nIts pain.\nIts attachments.\n\nBut the soul also chooses its path toward transcendence.\nAnd free will is the law that governs the game.\n\nThat’s why we forget.\nIf we remembered every past love,\nevery mistake,\nevery lesson...\nwe wouldn’t choose to grow.\nWe’d simply follow a script.\n\nBut this world is full of distractions.\nFull of noise.\nAnd yet…\nIf you listen closely, you’ll still hear it.\nThe pull.\nThe whisper.\nThe faint, ancient echo:\n\"You came here for something more.\"\n\nAnd that’s what makes it all so majestic.\n\nBecause when you die,\nyou’re not met with punishment.\nYou’re met with a mirror.\nNot to shame you...\nbut to show you.\n\nEvery guilt you buried.\nEvery fear you fed.\nEvery act of love you gave or withheld.\nIt all returns...not to damn you,\nbut to align you.\n\nKarma is not punishment.\nKarma is reflection.\n\nAnd when you awaken, even just a little…\nyou’ll start to notice:\n\nYou’re not being punished.\nYou’re being presented.\nWith people. With choices. With moments.\n\nNot to test you...\nbut to remind you who you came here to be.\n\nSo when someone triggers you,\nhurts you,\nor awakens something deep inside...\nask yourself:\nWhat part of me is trying to heal right now?\n\nBecause every encounter…\nis your soul’s purpose,\npushing for you.\n\nDirection is a mercy.\nAnd surrender…\nis how you receive it.\n\n#karmicaisntpunishment\n#soulcontracts\n#themirrorismercy\n#soulfamilytruth\n#rememberingyourself\n#everyencounterteaches", "images": ["assets/post-150-1.webp"], "archive_number": "5", "primary_archive": "V · The Walk", "featured": false, "published_in_archive": true}, {"id": "entry-151", "date": "2025-07-22", "timestamp": 1753205509, "title": "A Soul's Purpose: Part II", "display_text": "A Soul's Purpose – Part 2\nThe Resistance Was the Refinement\n\nIf death meets us right where we are on our path...\nthen I had to ask...where would it meet me?\n\nThe fear.\nThe confusion.\nNot from dying...\nbut from leaving behind everything I still feel attached to.\n\nLike a child clutching a stuffed animal,\nI hold onto people, places, ideas of who I thought I was.\nAnd yet… I feel them weighing me down, even as they kept me grounded.\n\nBut if I chose this life...\nif I now believe I chose it all...\nthen every struggle was a lesson, not a punishment.\nEvery mistake, every heartbreak, every doubt...\nthey were all meant for me.\n\nSouls must meet resistance to transcend.\nAnd my resistance?\nIt was pride. Ego. Fear. Attachment.\n\nI’ve been asleep to that truth.\nBut now I see:\nSurrender is not defeat.\nIt is the gate.\nThe key.\nThe mercy.\n\nThis moment is not my breaking point.\nIt’s my remembering point. \n\n#theresistance\n#soulrefinement\n#egoalchemy\n#attachmentshedding\n#awakeninghurts\n#transcendthroughtruth", "images": ["assets/post-151-1.webp"], "archive_number": "5", "primary_archive": "V · The Walk", "featured": false, "published_in_archive": true}, {"id": "entry-152", "date": "2025-07-22", "timestamp": 1753204774, "title": "A Soul's Purpose: Part I", "display_text": "A Soul’s Purpose \n\nIn full transparency...\nWhat I planned to share today… wasn’t this.\nBut the message that came through was louder.\nThis path is shifting daily, and I’ve chosen to follow.\nSo this is Part 1...exactly as it needed to arrive..\n\nI got a lot more than I bargained for last night.\nA soul’s purpose.\nIt came not in calm, but as direction...when calm was the only thing I wanted.\n\nThis isn’t my first time here.\nThis isn’t my soul’s first time here.\nI brought so much with me.\nSo much was already known.\nIt’s like I was always supposed to walk this path…\nLike I chose it...before.\n\nWhat I experienced shattered everything: The idea of heaven and hell.\nThe idea that death is the end.\nDeath… is a conscious transition.\nAnd what greets you?\nIt’s tied to your alignment, not your beliefs.\n\nA soul’s purpose.\nI don’t fully understand it yet.\nBut the Akashic records… the echoes of lifetimes past…\nI didn’t see them. I didn’t read them.\nI felt them.\nA longing older than my name...\nLike proof in my bones that this isn't my first incarnation.\n\nSo today…\nI ask not to know, but to align.\nI ask that my purpose reveal itself…\nNot in answers,\nbut in flow.\n\n#thesoulwhispers\n#theunknownpath\n#beforetheawakening\n#innerpull\n#divinealignment\n#followwithoutknowing", "images": ["assets/post-152-1.webp"], "archive_number": "5", "primary_archive": "V · The Walk", "featured": false, "published_in_archive": true}, {"id": "entry-153", "date": "2025-07-21", "timestamp": 1753113738, "title": "The Phoenix Rises in Surrender", "display_text": "The phoenix doesn’t rise in glory.\nIt rises in surrender.\n\nNot because it wants to burn...but because the illusion of safety has finally collapsed.\nThere’s nowhere left to run, so it turns inward.\nAnd in that inward spiral, it finds the spark.\n\nThis isn’t just a metaphor. It’s the pattern.\nThe quantum echo that repeats itself in every soul brave enough to let go of who they were told to be.\n\nBecause fire isn’t destruction.\nIt’s truth.\nIt burns away everything that isn’t aligned...and in its place, reveals what always was.\n\nThat’s what this phoenix holds.\n\nNot power through control.\nBut power through release.\nThe courage to shed the ego. The willingness to grieve what you once prayed for.\nThe strength to say:\n“I don’t know what’s next, but I know I can’t stay here.”\n\nThis is where foundational rebirth begins.\n\nLet the fire come.\nLet it cleanse what comfort corrupted.\nAnd when it’s done...when the smoke clears...\nwhat’s left will be real.\nUnshakeable.\nYou.\n\nFirst line: dismantles the old belief (punishment).\n\nSecond line: reclaims the truth (endurance).\n\nThird line: reframes the experience (invitation).\n\nFourth line: awakens the soul (revelation).\n#FoundationalRebirth\n#EnergyInMotion\n#AlignedBecoming\n#SoulInAshes\n#SacredSurrender\n#BecomingTheFire\n#flamekeeper", "images": ["assets/post-153-1.webp"], "archive_number": "5", "primary_archive": "V · The Walk", "featured": false, "published_in_archive": true}, {"id": "entry-154", "date": "2025-07-21", "timestamp": 1753111742, "title": "Foundational Rebirth", "display_text": "FOUNDATIONAL REBIRTH → ABUNDANCE & GRATITUDE\n\nThere will be moments in your life where everything burns...\nyour identity, your relationships, your sense of direction.\nAnd in that ash, there’s a silence that feels like death.\n\nBut that’s not the end.\nIt’s the alignment.\n\n#innerhealing #energywork #divinetiming #spiritualpath #alchemyofself\n\nYou were never meant to stay what the world made you to survive.\nYou were meant to rise, unrecognizable...even to yourself.\n\nThis phoenix isn’t mythology.\nIt’s memory.\nIt’s your memory, buried deep in the soul’s DNA.\nOf all the times you already came back stronger without realizing it.\n\nThe pain wasn’t punishment.\nIt was the portal.\n\nBecause on the other side of ego death… is true power.\nNot control. Not perfection.\nBut resonance.\n\nAnd when your fire meets another soul’s flame...\nthat’s quantum entanglement.\nA pattern echoing across time, pulling the right people, places, and shifts into your orbit.\n\nYou’re not rebuilding.\nYou’re remembering.\nAnd this piece is your proof.\n\n...\n\n🜂 FOUNDATIONAL REBIRTH ... The Flamekeeper \n\n#FoundationalRebirth\n#AbundanceAndGratitude\n#QuantumHealing\n#RisingFromTheAshes\n#EgoDeath\n#SpiritualAwakening\n#ConsciousAlignment\n#ShadowWork\n#EnergyShift\n#SoulAlchemy\n#PhoenixWithin\n#RebirthSeason\n#HealingThroughFire\n#CosmicTiming\n#YouAreTheFlame", "images": ["assets/post-154-1.webp"], "archive_number": "5", "primary_archive": "V · The Walk", "featured": false, "published_in_archive": false}, {"id": "entry-155", "date": "2025-07-20", "timestamp": 1753042659, "title": "When Letting Go Becomes Remembering", "display_text": "There’s a moment on the path where letting go stops feeling like surrender...and starts feeling like remembering.\n\nRemembering that the weight you’ve been dragging was never yours to carry.\n\nThat you were never meant to hold onto what only taught you how to hold on.\n\nI didn’t let go because I gave up.\nI let go because I finally saw how much I’d outgrown.\nIdeas, products, versions of me that used to fit...but no longer aligned.\n\nLetting go was the anchor point. The checkpoint. The choice that turned motion into meaning.\n\nI didn’t fall.\nI made space.\nAnd that space became alignment.\n\nIf you're reading this, maybe it's time to check in:\nWhat are you still holding that no longer feels like you?\n\nLet go.\nNot for the algorithm. Not for the optics.\nFor the alignment. \n\n#QuantumEntanglement #GratitudeAndAbundance #HealingJourney  \n#AlignmentOverHustle #LettingGoToGrow #SpiritualAwakening  \n#WalkInPurpose #ChasingNoMore #EnergyShift #InnerWork  \n#TrustThePath #BreakToHeal #SelfRealization #ConsciousCreator  \n#SpiritualTikTok #SoulAlignment #DeathOfTheChase", "images": ["assets/post-155-1.webp"], "archive_number": "5", "primary_archive": "V · The Walk", "featured": false, "published_in_archive": true}, {"id": "entry-156", "date": "2025-07-20", "timestamp": 1753022600, "title": "Breathe", "display_text": "Breathe.\nYou're not lost...you're just at the edge of expansion.\n\nHere's the download coming through:\n\nYou’ve done the work. The letting go. The showing up. The surrender.\nBut now it’s time to stop gripping the steering wheel. Let the current show you where it wants to go. You’re not here to control it...\nYou’re here to co-create with it.\n\nRight now, your clarity isn’t missing. It’s just hidden under too much mental noise.\nThe \"what ifs,\" the pressure, the plans that haven’t landed yet.\n\nSo here’s what’s clear:\n\nYou don’t need to chase the perfect idea.\nThe idea is already circling...you just have to get still enough to hear it.\n\nYou’re allowed to pivot.\nFlow doesn’t always follow your old blueprint. If a door isn’t opening, it’s not your fault. It’s not your door. Keep walking.\n\nYou already know the next step.\nIt’s the one that makes you feel alive again. That makes your chest lighter, not heavier.\n\nIf you need a mantra today, here it is:\n\n> “I release control. I invite clarity. I move in rhythm with what wants to become.”\n\nSay it. Write it. Then move with it. \n\nClarity + Alignment Focused\n#IReleaseControl\n#InviteClarity\n#FlowState\n#AlignedAction\n#TrustThePath\n#SpiritualAwakening\n#SoulDownloads\n#MoveWithTheUniverse\n#EnergeticAlignment \n#TheShiftIsHappening\n#YouFeltThatToo\n#MessagesFromTheUniverse\n#BreadcrumbsOfTruth\n#QuantumLiving\n#SignsEverywhere\n#EnergySpeaks\n#ConsciousCreators\n#BeyondCoincidence\n#InnerCompass \n#AbundanceAndGratitude\n#HealingInProgress\n#ThisIsYourSign\n#DeepBreathIn\n#KeepFollowingTheLight\n#BeStillAndKnow\n#LifeIsSpeaking\n#LetItBeEasy\n#YouAlreadyKnow\n#TheBecoming", "images": ["assets/post-156-1.webp"], "archive_number": "5", "primary_archive": "V · The Walk", "featured": false, "published_in_archive": false}, {"id": "entry-157", "date": "2025-07-20", "timestamp": 1752985066, "title": "Curiosity and Surrender", "display_text": "I thought curiosity was the spark. But it was surrender that lit the path.\n\nAfter I started asking questions, things began aligning...people, moments, even pain felt... guided. I used to think I had to control everything to feel safe. But the moment I let go and started trusting the current instead of fighting it, I tapped into something deeper than belief.\n\nThis journey goes far beyond coincidence. What’s coming next isn’t about just alignment...it’s about overflow. Quantum entanglement. Mirrored energy. Hidden codes that lead us back to ourselves.\n\nIf any of this is tugging at you, it’s probably not random.\nFollow along...I’ll show you how it all unfolded. One thread at a time.\n\n#LetGoAndFlow #QuantumJourney #OverflowSeason #AlignmentEnergy #GratitudeAndAbundance", "images": ["assets/post-157-1.webp"], "archive_number": "1", "primary_archive": "I · First Signals", "featured": false, "published_in_archive": true}];const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const nice=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});let lastFocus=null;let activeArchive="all";
function render(){let q=$('search').value.trim().toLowerCase();let found=entries.filter(x=>x.published_in_archive&&(activeArchive==='all'||String(x.archive_number)===activeArchive)&&(x.title+' '+x.display_text).toLowerCase().includes(q)).sort((a,b)=>$('sort').value==='new'?b.timestamp-a.timestamp:a.timestamp-b.timestamp);$('count').textContent=found.length+' writings';$('list').innerHTML=found.length?found.map(x=>`<button class="entry" data-id="${x.id}"><span class="date">${nice(x.date)}</span><span>${x.images.length?`<img class="entryimage" loading="lazy" src="${x.images[0]}" alt="">`:``}<span class="entrytitle">${esc(x.title)}</span><span class="excerpt">${esc(x.display_text.replace(/\s+/g,' ').slice(0,180))}${x.display_text.length>180?'…':''}</span></span><span class="arrow">↗</span></button>`).join(''):'<div class="empty">Nothing found. Try another phrase.</div>';document.querySelectorAll('.entry').forEach(b=>b.onclick=()=>openEntry(b.dataset.id))}
function openEntry(id){let x=entries.find(e=>e.id===id);if(!x)return;lastFocus=document.activeElement;$('rdate').textContent=x.primary_archive+' · '+nice(x.date);$('rtitle').textContent=x.title;$('rtext').textContent=x.display_text;$('rimages').innerHTML=x.images.map(src=>`<img class="art" loading="lazy" src="${src}" alt="Original image accompanying this writing">`).join('');$('reader').classList.add('active');document.body.style.overflow='hidden';$('reader').scrollTop=0;history.replaceState(null,'','#'+id);$('back').focus()}
function closeEntry(){ $('reader').classList.remove('active');document.body.style.overflow='';history.replaceState(null,'',location.pathname+location.search);if(lastFocus)lastFocus.focus()}
$('back').onclick=closeEntry;$('search').oninput=render;$('sort').onchange=render;document.querySelectorAll('[data-archive]').forEach(b=>b.addEventListener('click',()=>{activeArchive=b.dataset.archive;document.querySelectorAll('[data-archive]').forEach(n=>n.classList.toggle('selected',n===b));render();document.querySelector('.archive').scrollIntoView({behavior:'smooth'});}));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('reader').classList.contains('active'))closeEntry()});render();if(location.hash){let id=location.hash.slice(1);if(entries.some(x=>x.id===id))openEntry(id)}
</script></body></html>
